name: Build APK ARKAIOS Android

on:
  push:
    paths:
      - 'android-app/**'
    branches: [ MAIN, main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: arkaios-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
