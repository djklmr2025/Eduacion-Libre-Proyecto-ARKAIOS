name: Build APK ARKAIOS Android

on:
  push:
    paths:
      - 'android-app/**'
    branches: [ MAIN, main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias npm
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Crear Release y Subir APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "ARKAIOS App Android (v1.0.${{ github.run_number }})"
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
