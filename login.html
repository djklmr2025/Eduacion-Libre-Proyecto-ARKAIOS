<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKAIOS EDU — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.015) 2px, rgba(255,255,255,.015) 4px);
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: .15; pointer-events: none;
  }
  .orb1 { width: 500px; height: 500px; background: #3b82f6; top: -100px; left: -100px; }
  .orb2 { width: 400px; height: 400px; background: #6366f1; bottom: -100px; right: -50px; }

  .card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-top: 2px solid #3b82f6;
    backdrop-filter: blur(20px);
    padding: 3rem 2.5rem;
    width: 420px; max-width: 95vw;
    position: relative; z-index: 10;
    text-align: center;
  }
  .logo-ring {
    width: 72px; height: 72px; margin: 0 auto 1.5rem;
    border: 2px solid #3b82f6;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; color: #3b82f6;
    background: rgba(59,130,246,.1);
  }
  h1 { color: #fff; font-size: 24px; font-weight: 700; letter-spacing: 1px; margin-bottom: .5rem; }
  .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: .5rem; }
  .badge {
    display: inline-block;
    background: rgba(59,130,246,.15);
    border: 1px solid rgba(59,130,246,.3);
    color: #60a5fa; font-size: 10px; letter-spacing: 2px;
    padding: .2rem .8rem; margin-bottom: 2rem;
    text-transform: uppercase;
  }
  .divider { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 1.5rem 0; }

  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: .75rem;
    width: 100%; padding: .9rem 1.5rem;
    background: #fff; border: none;
    color: #1e293b; font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .2s;
  }
  .btn-google:hover { background: #f1f5f9; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .btn-google:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

  .features {
    display: grid; grid-template-columns: 1fr 1fr; gap: .75rem;
    margin: 1.5rem 0;
  }
  .feat {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.07);
    padding: .75rem;
    text-align: left;
  }
  .feat-icon { font-size: 18px; margin-bottom: .3rem; }
  .feat-title { color: #e2e8f0; font-size: 12px; font-weight: 600; }
  .feat-desc  { color: #64748b; font-size: 11px; margin-top: .15rem; }

  .status {
    margin-top: 1.5rem;
    font-size: 12px; color: #64748b;
    font-family: 'Courier New', monospace;
  }
  .status.loading { color: #60a5fa; }
  .status.error   { color: #ef4444; }
  .status.success { color: #22c55e; }

  #user-panel {
    display: none;
    margin-top: 1.5rem;
    background: rgba(34,197,94,.08);
    border: 1px solid rgba(34,197,94,.2);
    padding: 1rem;
    text-align: left;
  }
  .user-name { color: #22c55e; font-weight: 600; font-size: 14px; }
  .user-email { color: #94a3b8; font-size: 12px; margin-bottom: .75rem; }
  .api-key-box {
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.1);
    padding: .6rem .9rem;
    font-family: monospace; font-size: 11px; color: #60a5fa;
    word-break: break-all; margin-bottom: .75rem;
  }
  .btn-enter {
    width: 100%; padding: .75rem;
    background: #2563eb; border: none; color: #fff;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .2s; letter-spacing: 1px;
  }
  .btn-enter:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <div class="logo-ring">A</div>
  <h1>ARKAIOS EDU</h1>
  <div class="subtitle">Sistema Educativo Profesional</div>
  <div class="badge">Powered by ARKAIOS × ELEMIA</div>

  <div class="features">
    <div class="feat">
      <div class="feat-icon">📚</div>
      <div class="feat-title">Trabajos Escolares</div>
      <div class="feat-desc">Generación con IA</div>
    </div>
    <div class="feat">
      <div class="feat-icon">🎨</div>
      <div class="feat-title">Plantillas MX</div>
      <div class="feat-desc">Formato carta oficial</div>
    </div>
    <div class="feat">
      <div class="feat-icon">🤖</div>
      <div class="feat-title">Múltiples IAs</div>
      <div class="feat-desc">Gemini · Grok · GPT</div>
    </div>
    <div class="feat">
      <div class="feat-icon">🔑</div>
      <div class="feat-title">API Key Propia</div>
      <div class="feat-desc">Acceso personalizado</div>
    </div>
  </div>

  <hr class="divider">

  <button class="btn-google" id="btn-google" onclick="signInWithGoogle()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continuar con Google
  </button>

  <div id="user-panel">
    <div class="user-name" id="u-name"></div>
    <div class="user-email" id="u-email"></div>
    <div style="font-size:11px;color:#64748b;margin-bottom:.4rem;">TU API KEY EDUCATIVA:</div>
    <div class="api-key-box" id="u-apikey">Generando...</div>
    <button class="btn-enter" onclick="enterApp()">→ ENTRAR AL SISTEMA</button>
  </div>

  <div class="status" id="status">// Listo para autenticar</div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyD-ceCiJPVnLlepVBcMBhLABJEC771uypM",
    authDomain: "arkaios-world.firebaseapp.com",
    projectId: "arkaios-world",
    storageBucket: "arkaios-world.firebasestorage.app",
    messagingSenderId: "502663599735",
    appId: "1:502663599735:web:d702f5242ff9672e9c9872",
    measurementId: "G-7DM0S4M5QJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.addScope('email');
  provider.addScope('profile');

  window.signInWithGoogle = async function() {
    const btn = document.getElementById('btn-google');
    const status = document.getElementById('status');
    btn.disabled = true;
    status.textContent = '// Conectando con Google...';
    status.className = 'status loading';
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      status.textContent = `// Autenticado: ${user.email}`;
      status.className = 'status success';
      showUserPanel(user);
    } catch(e) {
      status.textContent = `// Error: ${e.message}`;
      status.className = 'status error';
      btn.disabled = false;
    }
  };

  function generateApiKey(uid, email) {
    const base = btoa(`ARK-EDU:${uid}:${email}:2026`).replace(/=/g,'');
    return `aek_${base.substring(0,32)}`;
  }

  function showUserPanel(user) {
    document.getElementById('btn-google').style.display = 'none';
    const panel = document.getElementById('user-panel');
    panel.style.display = 'block';
    document.getElementById('u-name').textContent = user.displayName || 'Usuario';
    document.getElementById('u-email').textContent = user.email;
    const apiKey = generateApiKey(user.uid, user.email);
    document.getElementById('u-apikey').textContent = apiKey;
    // Store in sessionStorage for the main app
    sessionStorage.setItem('ark_user', JSON.stringify({
      uid: user.uid,
      name: user.displayName,
      email: user.email,
      photo: user.photoURL,
      apiKey,
      token: user.accessToken
    }));
  }

  window.enterApp = function() {
    window.location.href = '/index.html';
  };

  // Check if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      const status = document.getElementById('status');
      status.textContent = `// Sesión activa: ${user.email}`;
      status.className = 'status success';
      showUserPanel(user);
    }
  });
</script>
</body>
</html>
